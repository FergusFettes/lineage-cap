name: Site
on:
  push:
    branches: [main]
    paths: ['blog.qmd', 'references.bib', 'site/**', 'first-flush-likelihood.pdf', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node site/check_model.js
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.40
      # The interactive blog is the front page; its widgets load site/*.js and site/blog.css.
      - run: quarto render blog.qmd --to html
      - run: |
          mkdir -p _site/site
          cp blog.html _site/index.html
          cp -r blog_files _site/
          cp site/model.js site/widgets.js site/blog.css _site/site/
          cp first-flush-likelihood.pdf _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
